name: a1-runtime-candidates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LEAN_SHA: 185c691b89f28bd68e48d53c02147415134975f0
  NAUTILUS_SHA: 8160730c7c550480b0a439fb11086a4c4de15f0b

jobs:
  lean-production-fill-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout finance-quant
        uses: actions/checkout@v4
        with:
          path: finance-quant

      - name: Checkout pinned LEAN source
        uses: actions/checkout@v4
        with:
          repository: QuantConnect/Lean
          ref: 185c691b89f28bd68e48d53c02147415134975f0
          path: lean
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify candidate pin and license
        working-directory: finance-quant
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/lean" rev-parse HEAD)" = "$LEAN_SHA"
          grep -q "Apache License" "$GITHUB_WORKSPACE/lean/LICENSE"
          python - <<'PY'
          import json
          from pathlib import Path
          pin = json.loads(Path("contracts/execution/lean-a1-candidate-pin-v1.json").read_text())
          assert pin["source_commit"] == "185c691b89f28bd68e48d53c02147415134975f0"
          assert pin["license_spdx"] == "Apache-2.0"
          assert pin["credentials_required"] is False
          assert pin["cli_used"] is False
          assert pin["runtime_disposition"] == "PENDING"
          PY

      - name: Build production LEAN fill-model probe
        working-directory: finance-quant
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tools/lean_a1_probe/LeanA1Probe.csproj \
            --configuration Release \
            -p:LeanRoot="$GITHUB_WORKSPACE/lean"

      - name: Run three deterministic candidate probes
        working-directory: finance-quant
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/a1-lean
          for run in 1 2 3; do
            set +e
            dotnet run --project tools/lean_a1_probe/LeanA1Probe.csproj \
              --configuration Release \
              --no-build \
              -p:LeanRoot="$GITHUB_WORKSPACE/lean" \
              -- fixtures/execution/a1-lean-fill-probe-v1.json \
              > "artifacts/a1-lean/raw-probe-${run}.json" \
              2> "artifacts/a1-lean/raw-probe-${run}.stderr.txt"
            probe_status=$?
            set -e
            cat "artifacts/a1-lean/raw-probe-${run}.json"
            if test -s "artifacts/a1-lean/raw-probe-${run}.stderr.txt"; then
              cat "artifacts/a1-lean/raw-probe-${run}.stderr.txt" >&2
            fi
            test "$probe_status" -eq 0
            python -m scripts.run_lean_a1_fill_probe \
              --fixture fixtures/execution/a1-lean-fill-probe-v1.json \
              --pin contracts/execution/lean-a1-candidate-pin-v1.json \
              --probe-result "artifacts/a1-lean/raw-probe-${run}.json" \
              --out "artifacts/a1-lean/evidence-${run}.json"
            RUN="$run" python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.run_lean_a1_fill_probe import load_probe_result

          run = os.environ["RUN"]
          raw = Path(f"artifacts/a1-lean/raw-probe-{run}.json")
          canonical = Path(f"artifacts/a1-lean/canonical-probe-{run}.json")
          canonical.write_text(
              json.dumps(load_probe_result(raw), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          done
          cmp artifacts/a1-lean/canonical-probe-1.json artifacts/a1-lean/canonical-probe-2.json
          cmp artifacts/a1-lean/canonical-probe-1.json artifacts/a1-lean/canonical-probe-3.json
          cmp artifacts/a1-lean/evidence-1.json artifacts/a1-lean/evidence-2.json
          cmp artifacts/a1-lean/evidence-1.json artifacts/a1-lean/evidence-3.json

      - name: Upload A1 LEAN probe receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-lean-production-fill-probe
          path: finance-quant/artifacts/a1-lean/
          if-no-files-found: warn

  nautilus-production-matching-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout finance-quant
        uses: actions/checkout@v4
        with:
          path: finance-quant

      - name: Checkout pinned NautilusTrader source
        uses: actions/checkout@v4
        with:
          repository: nautechsystems/nautilus_trader
          ref: 8160730c7c550480b0a439fb11086a4c4de15f0b
          path: nautilus-trader
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify candidate pin, license, and production bar path
        working-directory: finance-quant
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/nautilus-trader" rev-parse HEAD)" = "$NAUTILUS_SHA"
          grep -q "GNU LESSER GENERAL PUBLIC LICENSE" "$GITHUB_WORKSPACE/nautilus-trader/LICENSE"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          pin = json.loads(Path("contracts/execution/nautilus-a1-candidate-pin-v1.json").read_text())
          assert pin["source_commit"] == "8160730c7c550480b0a439fb11086a4c4de15f0b"
          assert pin["release_tag"] == "v1.230.0"
          assert pin["license_spdx"] == "LGPL-3.0-only"
          assert pin["credentials_required"] is False
          assert pin["cli_used"] is False
          assert pin["runtime_disposition"] == "PENDING"

          engine_path = Path("../nautilus-trader/nautilus_trader/backtest/engine.pyx")
          source = engine_path.read_text(encoding="utf-8")
          required = [
              "exchange.process_bar(data)",
              "self._data_engine.process(data)",
              "self._process_trade_bar_open(bar, tick)",
              "self._fill_at_market = True  # Gap from previous bar",
              "self.iterate(tick.ts_init)",
          ]
          for marker in required:
              assert marker in source, marker
          assert source.index("exchange.process_bar(data)") < source.index("self._data_engine.process(data)")

          evidence = {
              "schema_version": "1.0.0",
              "issue": 15,
              "phase": "A1",
              "candidate": "NautilusTrader",
              "source_commit": pin["source_commit"],
              "engine_source_sha256": hashlib.sha256(engine_path.read_bytes()).hexdigest(),
              "production_path": "BacktestEngine -> SimulatedExchange -> process_bar -> trade-bar-open",
              "exchange_bar_processed_before_strategy_delivery": True,
              "bar_open_processed_first": True,
              "gap_market_fill_enabled": True,
              "matching_iteration_uses_bar_ts_init": True,
              "production_probe_status": "EXECUTION_REQUIRED",
              "runtime_disposition": "PENDING",
              "authority": pin["authority"],
          }
          out = Path("artifacts/a1-nautilus")
          out.mkdir(parents=True, exist_ok=True)
          (out / "production-matching-preflight.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cat artifacts/a1-nautilus/production-matching-preflight.json

      - name: Install pinned NautilusTrader release
        working-directory: finance-quant
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "nautilus_trader==1.230.0"
          python - <<'PY'
          import nautilus_trader
          assert nautilus_trader.__version__ == "1.230.0", nautilus_trader.__version__
          PY

      - name: Run three production matching probes
        working-directory: finance-quant
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/a1-nautilus
          for run in 1 2 3; do
            set +e
            python tools/nautilus_a1_probe/probe.py fixtures/execution/a1-lean-fill-probe-v1.json \
              > "artifacts/a1-nautilus/raw-probe-${run}.json" \
              2> "artifacts/a1-nautilus/raw-probe-${run}.stderr.txt"
            probe_status=$?
            set -e
            cat "artifacts/a1-nautilus/raw-probe-${run}.json"
            if test -s "artifacts/a1-nautilus/raw-probe-${run}.stderr.txt"; then
              cat "artifacts/a1-nautilus/raw-probe-${run}.stderr.txt" >&2
            fi
            test "$probe_status" -eq 0
            RUN="$run" python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = os.environ["RUN"]
          path = Path(f"artifacts/a1-nautilus/raw-probe-{run}.json")
          value = json.loads(path.read_text(encoding="utf-8"))
          assert value["engine"] == "NautilusTrader"
          assert value["probe_scope"] == "BacktestEngine.SimulatedExchange.process_bar"
          assert value["status"] == "FILLED", value
          assert value["instrument_id"] == "AAA", value
          assert value["fill_quantity"] == "5", value
          assert value["fill_price"] in {"11", "11.00"}, value
          assert value["fill_time"] == "2026-06-02T13:30:00Z", value
          assert value["source_event_id"] == "bar-2", value
          canonical = Path(f"artifacts/a1-nautilus/canonical-probe-{run}.json")
          canonical.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          done
          cmp artifacts/a1-nautilus/canonical-probe-1.json artifacts/a1-nautilus/canonical-probe-2.json
          cmp artifacts/a1-nautilus/canonical-probe-1.json artifacts/a1-nautilus/canonical-probe-3.json

      - name: Upload A1 NautilusTrader probe receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-nautilus-production-fill-probe
          path: finance-quant/artifacts/a1-nautilus/
          if-no-files-found: warn
