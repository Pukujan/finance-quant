name: a2-core-assurance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a2-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate A2 durable contracts
        run: python scripts/validate_a2_contracts.py
      - name: Run A2 account/session/execution/risk/authority core tests
        run: >-
          python -m pytest
          tests/test_a2_contracts.py
          tests/test_a2_account.py
          tests/test_a2_session.py
          tests/test_a2_execution_session.py
          tests/test_a2_risk.py
          tests/test_a2_authority.py
          -q
