name: a2-hidden-acceptance

on:
  workflow_dispatch:
    inputs:
      seal_record_json:
        description: Public A2 SealRecord JSON only; never paste hidden cases, labels, IDs, or traces
        required: true
        type: string
      safe_receipt_json:
        description: Aggregate-only SafeAcceptanceReceipt JSON from the authorized isolated scorer
        required: true
        type: string
      candidate_artifact_hash:
        description: Expected lowercase sha256 of the exact frozen A2 public candidate tar
        required: true
        type: string
      public_eval_sha:
        description: Frozen 40-hex public A2 evaluation commit bound by SealRecord.eval_harness_sha
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-opaque-a2-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Materialize aggregate-only inputs
        env:
          A2_SEAL_RECORD_JSON: ${{ inputs.seal_record_json }}
          A2_SAFE_RECEIPT_JSON: ${{ inputs.safe_receipt_json }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path('a2-seal-record.json').write_text(os.environ['A2_SEAL_RECORD_JSON'], encoding='utf-8')
          Path('a2-safe-receipt.json').write_text(os.environ['A2_SAFE_RECEIPT_JSON'], encoding='utf-8')
          PY
      - name: Verify sealed A2 aggregate receipt fail-closed
        run: >-
          python -m scripts.verify_a2_hidden_acceptance
          --seal-record a2-seal-record.json
          --safe-receipt a2-safe-receipt.json
          --candidate-artifact-hash '${{ inputs.candidate_artifact_hash }}'
          --public-eval-sha '${{ inputs.public_eval_sha }}'
