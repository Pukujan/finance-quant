name: a2-candidate-freeze

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LEAN_SHA: 185c691b89f28bd68e48d53c02147415134975f0

jobs:
  freeze-public-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Fail closed on A2 contract or authority drift
        run: |
          python scripts/validate_a2_contracts.py
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('contracts/project/project-state.json').read_text())
          assert state['active_issue'] == 16 and state['assurance_phase'] == 'A2'
          assert state['authority']['trading'] == 'NONE'
          assert state['authority']['paper_trading_enabled'] is False
          assert state['authority']['live_capital_enabled'] is False
          PY
      - name: Build exact deterministic candidate twice
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_EVAL_SHA="$(git rev-parse HEAD)"
          git archive --format=tar --prefix=finance-quant/ "$PUBLIC_EVAL_SHA" > a2-public-candidate-1.tar
          git archive --format=tar --prefix=finance-quant/ "$PUBLIC_EVAL_SHA" > a2-public-candidate-2.tar
          cmp a2-public-candidate-1.tar a2-public-candidate-2.tar
          HASH="$(sha256sum a2-public-candidate-1.tar | awk '{print $1}')"
          PUBLIC_EVAL_SHA="$PUBLIC_EVAL_SHA" HASH="$HASH" LEAN_SHA="$LEAN_SHA" python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {
              'schema_version': '1.0.0',
              'issue': 16,
              'phase': 'A2',
              'public_eval_sha': os.environ['PUBLIC_EVAL_SHA'],
              'candidate_artifact_sha256': os.environ['HASH'],
              'archive_format': 'git archive --format=tar --prefix=finance-quant/',
              'lean_commit': os.environ['LEAN_SHA'],
              'scorecard_ref': 'issue-16-a2-public-contract-v1',
              'authority': 'NONE',
          }
          Path('a2-candidate-freeze-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a2-candidate-freeze-receipt
          path: a2-candidate-freeze-receipt.json
