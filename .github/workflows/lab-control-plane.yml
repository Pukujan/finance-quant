name: lab-control-plane

on:
  push:
    branches:
      - "bootstrap/oss-autonomous-trader-replatform"
    paths:
      - "finance_quant/lab/**"
      - "finance_quant/experiments/ledger.py"
      - "finance_quant/__main__.py"
      - "tests/test_lab_*.py"
      - ".github/workflows/lab-control-plane.yml"

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Fixed laboratory correctness tests
        run: python -m pytest tests/test_lab_*.py -q
      - name: Existing workstation regression
        run: python -m pytest tests/test_workstation_product.py -q
