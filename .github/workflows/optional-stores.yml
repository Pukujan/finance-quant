name: optional-stores

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

env:
  FQ_TEST_OPTIONAL_STORES: "1"

jobs:
  optional-stores:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install base dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install optional store dependencies
        continue-on-error: true
        run: |
          python -m pip install "psycopg[binary]" || echo "psycopg[binary] unavailable"
          python -m pip install xtdb-client || echo "xtdb-client unavailable"
          python -m pip install arcticdb || echo "arcticdb unavailable"

      - name: Run optional store contract tests
        run: python -m pytest tests/test_optional_store_contract.py -q --run-optional-stores
